    <text x="330" y="98" font-family="Bahnschrift, 'Segoe UI', Arial" font-weight="700" font-size="40" fill="#13386b">VICE CITY WALK-IN CLINIC</text>
    <text x="331" y="134" font-family="Bahnschrift, Arial" font-size="22" fill="#5b5f6b" letter-spacing="3">LEONIDA · OPEN 24/7 SINCE 2013</text>
    <text x="331" y="172" font-family="Georgia, serif" font-style="italic" font-size="25" fill="#2a2d36">Attending: Dr. Ghost, M.D.</text>
    <line x1="160" y1="210" x2="920" y2="210" stroke="#2a2d36" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- transaction lines -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#2a2d36">
      <text x="160" y="250" font-family="Bahnschrift, Arial" font-weight="700" font-size="34" fill="#1d1f26">PATIENT BILL</text>
      <text x="920" y="248" text-anchor="end">Receipt #2013-1119</text>
      <text x="160" y="288">Nov 19, 2026  12:01 AM</text>
      <text x="920" y="288" text-anchor="end">Visit: launch day</text>
      <text x="160" y="324">Patient: one very patient gamer, 31</text>

      <text x="160" y="562">ITEM</text>
      <text x="920" y="562" text-anchor="end">AMOUNT</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="29" fill="#1d1f26">
      <text x="160" y="604">13-year incubation, waiting room</text><text x="920" y="604" text-anchor="end">$13.00</text>

      <text x="160" y="772">Alligator bite, parking lot</text><text x="920" y="772" text-anchor="end">$305.00</text>
      <text x="160" y="814">Doctor's note: 5 sick days</text><text x="920" y="814" text-anchor="end">$79.99</text>
    </g>
    <line x1="160" y1="840" x2="920" y2="840" stroke="#2a2d36" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- totals -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#2a2d36">
      <text x="160" y="876">SUBTOTAL</text><text x="920" y="876" text-anchor="end">$637.99</text>
    </g>
    <text x="160" y="926" font-family="Impact, 'Arial Black', sans-serif" font-size="46" fill="#1d1f26">TOTAL</text>
    <text x="920" y="926" text-anchor="end" font-family="Impact, 'Arial Black', sans-serif" font-size="46" fill="#1d1f26">$637.99</text>
    <line x1="160" y1="946" x2="920" y2="946" stroke="#2a2d36" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- payment -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#1d1f26">
